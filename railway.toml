# Staging / demo deploy for Lawyer Workbench.
# Docs: README.md → Deploy (Railway staging)

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# package.json `start` already runs db:migrate before next start.
preDeployCommand = ["npm run db:migrate"]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
